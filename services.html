<!DOCTYPE html>
<html lang="en">
<head>

  <style>

      .ready-section {

      .ready-img {

        display: none;

        width: 100% !important;
        height: 100% !important;
        z-index: 20;
        background-image: url('images/SEND MESSAGE.png');
        background-size: 100% 100% !important;
        background-repeat: no-repeat;
      }

        left: 0;
        width: 100%;
        height: 100%;
      }

      .ready-section.form-active .ready-img {
        min-height: 320px !important;
        opacity: 0 !important;
      }

      .form-field {
        position: absolute;
        background: transparent;
        border: none;
        outline: none;
        font-size: 11px !important;
        color: #333;
        padding-left: 34px !important;
        padding-right: 10px !important;
        font-family: Arial, sans-serif;
      }

      .input-name { top: 19.5% !important; left: 8% !important; width: 84% !important; height: 10% !important; }
      .input-email { top: 33.8% !important; left: 8% !important; width: 84% !important; height: 10% !important; }
      .input-subject { top: 47.8% !important; left: 8% !important; width: 84% !important; height: 10% !important; }
      .input-message { top: 63.5% !important; left: 8% !important; width: 84% !important; height: 18% !important; padding-top: 5px; padding-left: 34px !important; resize: none; }
      .send-btn-hotspot { position: absolute; top: 87.5% !important; left: 18% !important; width: 64% !important; height: 9.5% !important; background: transparent; border: none; cursor: pointer; }

      .footer-section {
        position: relative;
        width: 100%;
        overflow: hidden;
        line-height: 0;
      }

      .footer-img {
        display: block;
        width: 100%;
        height: auto;
      }

      .back-to-top-hotspot {
        position: absolute;
        bottom: 10%;
        right: 14.5%;
        width: 5%;
        height: 12%;
        z-index: 10;
        cursor: pointer;
        background: transparent;
        border: none;
      }
    }
  </style>
</head>
<body id="top">

  <div class="master-canvas">

    <!-- WHY CHOOSE US SECTION -->
    <section class="why-choose-section">
      <!-- Desktop Elements -->
      <div class="why-choose-container desktop-only">
        <div class="why-choose-left" data-aos="fade-right">
          <img src="images/PAGE 2/GEA OIL why choose us text 1 box.png" alt="Why Choose Us Box" class="card-box-img">
          <img src="images/PAGE 2/GEA OIL why choose us text 1.png" alt="Why Choose Us Text" class="card-text-overlay">
        </div>

        <div class="why-choose-right" id="whyChooseRight" data-aos="fade-left">
          <img src="images/PAGE 2/GEA OIL why choose us text 2.png" alt="About Geo Oil Trading" id="whyChooseImg">

      <img class="ready-img" id="defaultReadyImg" src="images/GEA OIL are you ready.png" alt="Are you ready to trade with GEA Oil Trading DMCC" />
      <button class="contact-hotspot" id="showFormBtn" aria-label="Get in touch"></button>
      <a href="https://wa.me/971551712844" target="_blank" class="whatsapp-hotspot" aria-label="Chat with us on WhatsApp"></a>

      <div class="form-container-overlay" id="formOverlay">
        <form id="contactForm" action="https://formspree.io/f/xzeplaga" method="POST" class="interactive-form">
          <input type="text" name="name" class="form-field input-name" required placeholder="Name" />
          <input type="email" name="email" class="form-field input-email" required placeholder="Email Address" />
          <input type="text" name="subject" class="form-field input-subject" required placeholder="Subject" />
          <textarea name="message" class="form-field input-message" required placeholder="Message"></textarea>
          <button type="submit" class="send-btn-hotspot" aria-label="Send Message"></button>
        </form>
      </div>
    </section>

    <!-- FOOTER SECTION -->
    <section class="footer-section" id="contact" data-aos="fade-up">
      <img class="footer-img" src="images/GEA OIL footer.png" alt="GEA Oil Trading DMCC Footer" />
      <a href="#top" class="back-to-top-hotspot" aria-label="Scroll back to top"></a>
    </section>

  </div>

  <script>
    AOS.init({
      duration: 800,
      once: false,
      mirror: true,
      easing: 'ease-in-out'
    });

    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const mobileDrawer = document.getElementById('mobileDrawer');
    const showFormBtn = document.getElementById('showFormBtn');
    const formOverlay = document.getElementById('formOverlay');
    const contactForm = document.getElementById('contactForm');
    const readySection = document.getElementById('ready');

    if (hamburgerBtn && mobileDrawer) {
      hamburgerBtn.addEventListener('click', () => {
        mobileDrawer.classList.toggle('active');
      });

      document.querySelectorAll('.mobile-nav-drawer a').forEach(link => {
        link.addEventListener('click', () => {
          mobileDrawer.classList.remove('active');
        });
      });
    }

    function openForm() {
      if (formOverlay) {
        formOverlay.style.backgroundImage = "url('images/SEND MESSAGE.png')";
        if (contactForm) contactForm.style.display = 'block';
        formOverlay.style.display = 'block';
        if (readySection) readySection.classList.add('form-active');
      }
    }

    if (showFormBtn) showFormBtn.addEventListener('click', openForm);

    document.querySelectorAll('.getInTouchBtn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        openForm();
        if (readySection) {
          readySection.scrollIntoView({ behavior: 'smooth' });
        }
      });
    });

    if (contactForm) {
      contactForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = new FormData(contactForm);
        
        const showThankYouState = () => {
          if (contactForm) contactForm.style.display = 'none';
          if (formOverlay) formOverlay.style.backgroundImage = "url('images/Thanks for contacting us.png')";

          contactForm.reset();

          setTimeout(() => {
            if (formOverlay) formOverlay.style.display = 'none';
            if (contactForm) contactForm.style.display = 'block';
            if (formOverlay) formOverlay.style.backgroundImage = "url('images/SEND MESSAGE.png')";
            if (readySection) readySection.classList.remove('form-active');
          }, 5000);
        };

        fetch('https://formspree.io/f/xzeplaga', {
          method: 'POST',
          body: formData,
          headers: { 'Accept': 'application/json' }
        })
        .then(() => showThankYouState())
        .catch(() => showThankYouState());
      });
    }

    if (window.location.hash === '#ready') {
      openForm();
    }
  </script>
</body>

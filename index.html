<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GEA OIL TRADING DMCC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
      background: #efefee;
    }

    .page-shell {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      background: #efefee;
      position: relative;
    }

    /* HEADER HERO */
    .header-hero {
      position: relative;
      width: 100%;
      aspect-ratio: 4501 / 2532;
      overflow: hidden;
      background: transparent;
    }

    .hero-background {
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      object-fit: cover;
    }

    .hero-images {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .hero-welcome {
      position: absolute;
      top: 29%;
      left: 10%;
      z-index: 3;
      display: block;
      width: 18%;
      height: auto;
      opacity: 0;
    }

    .hero-text {
      position: absolute;
      top: 17%;
      left: 10%;
      z-index: 3;
      display: block;
      width: 44%;
      height: auto;
      opacity: 0;
    }

    .hero-images img {
      position: absolute;
      display: block;
      height: auto;
      opacity: 0;
    }

    .hero-pumpjacks { left: 0; top: 63%; width: 34.5%; }
    .hero-refinery { left: 37.5%; top: 52%; width: 29.5%; }
    .hero-ship { left: 70%; top: 45%; width: 26.5%; }

    .header-hero.is-visible .hero-welcome { animation: reveal-text 0.8s ease-out 0s both; }
    .header-hero.is-visible .hero-text { animation: reveal-text 0.9s ease-out 0.4s both; }
    .header-hero.is-visible .hero-pumpjacks { animation: enter-from-left 0.9s ease-out 0.2s both; }
    .header-hero.is-visible .hero-refinery { animation: enter-from-bottom 0.9s ease-out 0.2s both; }
    .header-hero.is-visible .hero-ship { animation: enter-from-right 0.9s ease-out 0.2s both; }

    @keyframes enter-from-left {
      from { opacity: 0; transform: translateX(-50px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes enter-from-bottom {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes enter-from-right {
      from { opacity: 0; transform: translateX(50px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes reveal-text {
      from { opacity: 0; clip-path: inset(0 100% 0 0); }
      to { opacity: 1; clip-path: inset(0 0 0 0); }
    }

    /* NAVIGATION */
    .nav-row {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 2.2% 8% 0 4%;
    }

    .nav-row nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      flex-wrap: nowrap;
    }

    .nav-row a {
      display: block;
      color: #111111;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      padding: 4px 0;
      cursor: pointer;
      pointer-events: auto;
      white-space: nowrap;
    }

    .hamburger-btn {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      width: 14px;
      height: 10px;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 30;
      padding: 0;
    }

    .hamburger-btn span {
      display: block;
      width: 100%;
      height: 1.5px;
      background-color: #111111;
      border-radius: 1px;
      transition: all 0.3s ease-in-out;
    }

    .hamburger-btn.active span:nth-child(1) { transform: translateY(4.25px) rotate(45deg); }
    .hamburger-btn.active span:nth-child(2) { opacity: 0; }
    .hamburger-btn.active span:nth-child(3) { transform: translateY(-4.25px) rotate(-45deg); }

    /* ABOUT SECTION */
    .about-section {
      position: relative;
      width: 100%;
      aspect-ratio: 4501 / 4774;
      overflow: hidden;
      background: #003e3c;
    }

    .about-background {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .about-title-art, .about-ceo-art, .about-platform-art { opacity: 0; }
    .about-title-art { position: absolute; top: 6%; left: 43%; width: 14%; height: auto; }
    .about-ceo-art { position: absolute; top: 23%; left: 47%; width: 47%; height: auto; }
    .about-platform-art { position: absolute; top: 70%; left: 10%; width: 24%; height: auto; }

    .about-year-wrap {
      position: absolute;
      top: 23%;
      left: 26%;
      width: 12.5%;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .about-year {
      display: block;
      font-family: Verdana, sans-serif;
      font-size: clamp(14px, 3.8vw, 55px);
      font-weight: 700;
      line-height: 0.9;
    }

    .about-since {
      display: block;
      width: 48%;
      height: auto;
      margin-top: 4px;
    }

    .about-section.is-visible .about-title-art { animation: reveal-text 0.8s ease-out both; }
    .about-section.is-visible .about-ceo-art { animation: enter-from-right 0.9s ease-out 0.2s both; }
    .about-section.is-visible .about-platform-art { animation: enter-from-left 0.9s ease-out 0.3s both; }

    /* REFINERY SECTION */
    .refinery-section {
      width: 100%;
      overflow: hidden;
      line-height: 0;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.9s ease-out, transform 0.9s ease-out;
    }

    .refinery-section.is-visible { opacity: 1; transform: translateY(0); }
    .refinery-img { display: block; width: 100%; height: auto; }

    /* ARE YOU READY SECTION */
    .ready-section {
      width: 100%;
      overflow: hidden;
      line-height: 0;
      position: relative;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.9s ease-out, transform 0.9s ease-out;
    }

    .ready-section.is-visible { opacity: 1; transform: translateY(0); }

    .ready-img {
      display: block;
      width: 100%;
      height: auto;
    }

    .contact-hotspot {
      position: absolute;
      top: 75.8%;
      left: 6.2%;
      width: 16%;
      height: 10.2%;
      z-index: 10;
      cursor: pointer;
      display: block;
    }

    .whatsapp-hotspot {
      position: absolute;
      top: 75.8%;
      left: 23.1%;
      width: 17%;
      height: 10.2%;
      z-index: 10;
      cursor: pointer;
      display: block;
    }

    /* FOOTER SECTION */
    .footer-section {
      width: 100%;
      overflow: hidden;
      line-height: 0;
      position: relative;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.9s ease-out, transform 0.9s ease-out;
    }

    .footer-section.is-visible { opacity: 1; transform: translateY(0); }
    .footer-img { display: block; width: 100%; height: auto; }

    .back-to-top-hotspot {
      position: absolute;
      bottom: 10%;
      right: 14.5%;
      width: 5%;
      height: 12%;
      z-index: 10;
      cursor: pointer;
      display: block;
    }

    /* MOBILE RESPONSIVE FIXES */
    @media (max-width: 768px) {
      .nav-row {
        padding-top: 5%;
        padding-right: 5%;
      }

      .hamburger-btn {
        display: flex;
      }

      .nav-row nav {
        display: none;
        position: absolute;
        top: calc(100% + 4px);
        right: 5%;
        background: #ffffff;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 3px 0;
        border-radius: 3px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        min-width: 95px;
      }

      .nav-row nav.active {
        display: flex;
      }

      .nav-row a {
        font-size: 9px;
        font-weight: 600;
        padding: 5px 8px;
        border-bottom: 1px solid #f2f2f2;
      }

      .nav-row a:last-child {
        border-bottom: none;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="header-hero" id="home" aria-label="GEA homepage hero section">
      <div class="nav-row">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle Navigation Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav id="navMenu" aria-label="Main navigation">
          <a href="#home">Home</a>
          <a href="#about">About Us</a>
          <a href="services.html#services">Services</a>
          <a href="services.html#products">Product</a>
          <a href="services.html#ready">Contact Us</a>
        </nav>
      </div>
      <img class="hero-background" src="images/HERO ASSETS/Hero Welcome.png" alt="GEA welcome hero image" />
      <img class="hero-welcome" src="images/HERO ASSETS/Hero Welcome to.png" alt="Welcome to" />
      <img class="hero-text" src="images/HERO ASSETS/Hero Welcome text.png" alt="GEA Oil Trading DMCC" />
      <div class="hero-images" aria-hidden="true">
        <img class="hero-pumpjacks" src="images/HERO ASSETS/Hero image 1.png" alt="" />
        <img class="hero-refinery" src="images/HERO ASSETS/Hero image 2.png" alt="" />
        <img class="hero-ship" src="images/HERO ASSETS/Hero image 3.png" alt="" />
      </div>
    </header>

    <section class="about-section" id="about" aria-label="About Us">
      <img class="about-background" src="images/About us/Main Background.png" alt="" />
      <img class="about-title-art" src="images/About us/about us txt.png" alt="About Us" />
      <img class="about-ceo-art" src="images/About us/CEO MESSAGE.png" alt="About Us message from the CEO" />
      <img class="about-platform-art" src="images/About us/OIL PLATFORM TEXT.png" alt="Our oil platform" />
      <div class="about-year-wrap">
        <span class="about-year" data-target="2023">0000</span>
        <img class="about-since" src="images/About us/SINCE.png" alt="Since" />
      </div>
    </section>

    <section class="refinery-section">
      <img class="refinery-img" src="images/refinery.png" alt="GEA Oil Trading Refinery" />
    </section>

    <section class="ready-section" id="ready">
      <img class="ready-img" src="images/GEA OIL are you ready.png" alt="Are you ready to trade with GEA Oil Trading DMCC" />
      <a href="services.html#ready" class="contact-hotspot" aria-label="Get in touch"></a>
      <a href="https://wa.me/971551712844" target="_blank" class="whatsapp-hotspot" aria-label="Chat with us on WhatsApp"></a>
    </section>

    <section class="footer-section">
      <img class="footer-img" src="images/GEA OIL footer.png" alt="GEA Oil Trading DMCC Footer" />
      <a href="#home" class="back-to-top-hotspot" aria-label="Scroll back to top"></a>
    </section>
  </div>

  <script>
    /* HAMBURGER MENU */
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const navMenu = document.getElementById('navMenu');

    if (hamburgerBtn && navMenu) {
      hamburgerBtn.addEventListener('click', () => {
        hamburgerBtn.classList.toggle('active');
        navMenu.classList.toggle('active');
      });

      document.querySelectorAll('#navMenu a').forEach(link => {
        link.addEventListener('click', () => {
          hamburgerBtn.classList.remove('active');
          navMenu.classList.remove('active');
        });
      });
    }

    /* YEAR COUNTER ANIMATION */
    const yearElement = document.querySelector('.about-year');
    let yearAnimFrame = null;

    const countYear = () => {
      if (yearAnimFrame) cancelAnimationFrame(yearAnimFrame);
      const targetYear = Number(yearElement.dataset.target);
      const duration = 1200;
      const startTime = performance.now();

      const updateYear = (currentTime) => {
        const progress = Math.min((currentTime - startTime) / duration, 1);
        yearElement.textContent = String(Math.floor(progress * targetYear)).padStart(4, '0');
        if (progress < 1) {
          yearAnimFrame = requestAnimationFrame(updateYear);
        }
      };
      yearAnimFrame = requestAnimationFrame(updateYear);
    };

    const resetYear = () => {
      if (yearAnimFrame) cancelAnimationFrame(yearAnimFrame);
      yearElement.textContent = '0000';
    };

    const sectionObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          if (entry.target.classList.contains('about-section')) {
            countYear();
          }
        } else {
          entry.target.classList.remove('is-visible');
          if (entry.target.classList.contains('about-section')) {
            resetYear();
          }
        }
      });
    }, { threshold: 0.15 });

    document.querySelectorAll('.header-hero, .about-section, .refinery-section, .ready-section, .footer-section').forEach((section) => {
      sectionObserver.observe(section);
    });
  </script>
</body>
</html>

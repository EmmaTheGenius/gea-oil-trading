  <script>
    const setupMenu = (btnId, menuId) => {
      const btn = document.getElementById(btnId);
      const menu = document.getElementById(menuId);
      if (btn && menu) {
        btn.addEventListener('click', () => {
          btn.classList.toggle('active');
          menu.classList.toggle('active');
        });
        menu.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', () => {
            btn.classList.remove('active');
            menu.classList.remove('active');
          });
        });
      }
    };
    setupMenu('hamburgerBtn', 'navMenu');
    setupMenu('hamburgerBtnMob', 'navMenuMob');

    let dtAnimFrame = null;
    let mbAnimFrame = null;

    const countYear = (el, isMob = false) => {
      if (!el) return;
      if (isMob && mbAnimFrame) cancelAnimationFrame(mbAnimFrame);
      if (!isMob && dtAnimFrame) cancelAnimationFrame(dtAnimFrame);

      const targetYear = Number(el.dataset.target);
      const duration = 1200;
      const startTime = performance.now();

      const updateYear = (currentTime) => {
        const progress = Math.min((currentTime - startTime) / duration, 1);
        el.textContent = String(Math.floor(progress * targetYear)).padStart(4, '0');
        if (progress < 1) {
          if (isMob) mbAnimFrame = requestAnimationFrame(updateYear);
          else dtAnimFrame = requestAnimationFrame(updateYear);
        }
      };

      if (isMob) mbAnimFrame = requestAnimationFrame(updateYear);
      else dtAnimFrame = requestAnimationFrame(updateYear);
    };

    const resetYear = (el, isMob = false) => {
      if (!el) return;
      if (isMob && mbAnimFrame) cancelAnimationFrame(mbAnimFrame);
      if (!isMob && dtAnimFrame) cancelAnimationFrame(dtAnimFrame);
      el.textContent = '0000';
    };

    const sectionObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          if (entry.target.classList.contains('about-section')) {
            const dtYear = entry.target.querySelector('.about-year');
            const mbYear = entry.target.querySelector('.mob-about-year');
            if (dtYear) countYear(dtYear, false);
            if (mbYear) countYear(mbYear, true);
          }
        } else {
          entry.target.classList.remove('is-visible');
          if (entry.target.classList.contains('about-section')) {
            const dtYear = entry.target.querySelector('.about-year');
            const mbYear = entry.target.querySelector('.mob-about-year');
            if (dtYear) resetYear(dtYear, false);
            if (mbYear) resetYear(mbYear, true);
          }
        }
      });
    }, { 
      root: null,
      rootMargin: '0px 0px -10% 0px',
      threshold: 0.15 
    });

    document.querySelectorAll('.header-hero, .about-section, .refinery-section, .ready-section, .footer-section').forEach((section) => {
      sectionObserver.observe(section);
    });
  </script>
</body>
</html>
